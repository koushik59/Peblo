name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo_secret
          POSTGRES_DB: peblo_tv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio flake8

      - name: Lint with flake8
        working-directory: backend
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@localhost:5432/peblo_tv_test
          DATABASE_URL_SYNC: postgresql://peblo:peblo_secret@localhost:5432/peblo_tv_test
          JWT_SECRET: ci-test-secret-key
          STORAGE_PATH: ./test_storage
        run: |
          pytest -v tests/

  frontend-build:
    name: Frontend Build & Typechecks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            cms/package.json
            viewer/package.json

      - name: Build CMS
        working-directory: cms
        run: |
          npm ci || npm install
          npm run build

      - name: Build Viewer
        working-directory: viewer
        run: |
          npm ci || npm install
          npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose build

  deploy-template:
    name: Deployment (Documentation & Staging Template)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Instructions & Template
        run: |
          echo "================================================================="
          echo "PRODUCTION DEPLOYMENT WORKFLOW TEMPLATE"
          echo "================================================================="
          echo "In a production environment, this step would:"
          echo "1. Authenticate with Cloud Provider (e.g. AWS ECR / GCP Artifact Registry)"
          echo "2. Push versioned Docker images tagged with git SHA"
          echo "3. Execute database migration safely against production DB cluster"
          echo "4. Deploy to Kubernetes / AWS ECS / Cloud Run with rolling updates"
          echo "5. Inject secrets securely via Cloud Secret Manager / HashiCorp Vault"
          echo "================================================================="
