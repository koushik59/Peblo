services:
  db:
    image: postgres:16-alpine
    container_name: peblo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@db:5432/peblo_tv
      DATABASE_URL_SYNC: postgresql://peblo:peblo_secret@db:5432/peblo_tv
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 480
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage_data
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage_data
      - ./assets:/assets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: peblo-cms
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: peblo-viewer
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
